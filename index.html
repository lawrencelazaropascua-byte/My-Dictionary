<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Dictionary & Idiom Finder</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 2rem 1rem;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 720px;
    }

    header {
      margin-bottom: 2rem;
      text-align: center;
    }

    header h1 {
      font-size: 2.25rem;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
    }

    /* Search Bar */
    .search-box {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

    .search-box input {
      flex: 1;
      padding: 0.85rem 1.25rem;
      font-size: 1.1rem;
      border: 2px solid var(--border);
      border-radius: 0.75rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .search-box button {
      padding: 0.85rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 0.75rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .search-box button:hover {
      background-color: var(--primary-hover);
    }

    /* Status Messages */
    .status-msg {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .error-msg {
      color: #ef4444;
    }

    /* Dictionary Content Layout */
    .word-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: 1rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .word-title h2 {
      font-size: 2rem;
      text-transform: capitalize;
    }

    .phonetic {
      font-size: 1.1rem;
      color: var(--primary);
      margin-top: 0.25rem;
      font-weight: 500;
    }

    .audio-btn {
      background-color: #e0e7ff;
      color: var(--primary);
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      transition: transform 0.1s, background-color 0.2s;
    }

    .audio-btn:hover {
      background-color: #c7d2fe;
      transform: scale(1.05);
    }

    /* Meanings Card */
    .meaning-block {
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: 1rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .part-of-speech {
      font-style: italic;
      font-weight: 700;
      color: var(--primary);
      text-transform: lowercase;
      margin-bottom: 1rem;
      font-size: 1.1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }

    .definition-list {
      list-style-type: decimal;
      padding-left: 1.25rem;
    }

    .definition-item {
      margin-bottom: 1rem;
      line-height: 1.5;
    }

    .definition-item:last-child {
      margin-bottom: 0;
    }

    .example-sentence {
      margin-top: 0.4rem;
      color: var(--text-muted);
      font-size: 0.95rem;
      background-color: #f1f5f9;
      padding: 0.5rem 0.75rem;
      border-left: 3px solid var(--primary);
      border-radius: 0 0.4rem 0.4rem 0;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Online Dictionary</h1>
      <p>Search words, idioms, phonetics, definitions, and sentence examples.</p>
    </header>

    <!-- Search Section -->
    <div class="search-box">
      <input 
        type="text" 
        id="searchInput" 
        placeholder="Enter a word or idiom (e.g., convenient, bite the bullet)..." 
        autocomplete="off"
      />
      <button id="searchBtn">Search</button>
    </div>

    <!-- Status Output -->
    <div id="status" class="status-msg hidden"></div>

    <!-- Results Section -->
    <main id="resultContainer" class="hidden">
      <div class="word-header">
        <div class="word-title">
          <h2 id="wordText">---</h2>
          <div id="phoneticText" class="phonetic">---</div>
        </div>
        <button id="audioBtn" class="audio-btn" title="Listen to pronunciation">🔊</button>
      </div>

      <div id="meaningsContainer"></div>
    </main>
  </div>

  <script>
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const statusDiv = document.getElementById('status');
    const resultContainer = document.getElementById('resultContainer');
    const wordText = document.getElementById('wordText');
    const phoneticText = document.getElementById('phoneticText');
    const audioBtn = document.getElementById('audioBtn');
    const meaningsContainer = document.getElementById('meaningsContainer');

    let currentAudioUrl = '';

    // Handle Search triggers
    searchBtn.addEventListener('click', performSearch);
    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') performSearch();
    });

    async function performSearch() {
      const query = searchInput.value.trim().toLowerCase();
      if (!query) return;

      showStatus('Searching...');
      resultContainer.classList.add('hidden');

      try {
        // Attempt Primary Fetch via Free Dictionary API
        const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(query)}`);
        
        if (response.ok) {
          const data = await response.json();
          renderDictionaryData(data[0]);
        } else {
          // Fallback fetch for idioms/phrases via Datamuse API if primary lookup misses
          await fetchIdiomFallback(query);
        }
      } catch (err) {
        showStatus('An error occurred while fetching dictionary data. Please check your network connection.', true);
      }
    }

    function renderDictionaryData(entry) {
      statusDiv.classList.add('hidden');
      resultContainer.classList.remove('hidden');

      // 1. Render Word Title
      wordText.textContent = entry.word;

      // 2. Extract Phonetics & Audio
      let phonetic = entry.phonetic || '';
      let audioUrl = '';

      if (entry.phonetics && entry.phonetics.length > 0) {
        for (const p of entry.phonetics) {
          if (p.text && !phonetic) phonetic = p.text;
          if (p.audio && !audioUrl) audioUrl = p.audio;
        }
      }

      phoneticText.textContent = phonetic || '[ pronunciation unavailable ]';
      currentAudioUrl = audioUrl;

      // Toggle audio button depending on availability
      if (audioUrl) {
        audioBtn.style.display = 'flex';
      } else {
        audioBtn.style.display = 'none';
      }

      // 3. Render Meanings & Example Sentences per Definition
      meaningsContainer.innerHTML = '';

      entry.meanings.forEach(meaning => {
        const block = document.createElement('div');
        block.className = 'meaning-block';

        const pos = document.createElement('div');
        pos.className = 'part-of-speech';
        pos.textContent = meaning.partOfSpeech;
        block.appendChild(pos);

        const list = document.createElement('ol');
        list.className = 'definition-list';

        meaning.definitions.forEach(defObj => {
          const item = document.createElement('li');
          item.className = 'definition-item';
          
          let htmlContent = `<div>${defObj.definition}</div>`;
          
          // Render example sentence if present
          if (defObj.example) {
            htmlContent += `<div class="example-sentence"><strong>Example:</strong> "${defObj.example}"</div>`;
          } else {
            htmlContent += `<div class="example-sentence"><strong>Example:</strong> <em>No example sentence provided for this meaning.</em></div>`;
          }

          item.innerHTML = htmlContent;
          list.appendChild(item);
        });

        block.appendChild(list);
        meaningsContainer.appendChild(block);
      });
    }

    // Secondary fallback for idioms & multi-word expressions
    async function fetchIdiomFallback(phrase) {
      const datamuseRes = await fetch(`https://api.datamuse.com/words?sp=${encodeURIComponent(phrase)}&md=d&max=1`);
      const data = await datamuseRes.json();

      if (data.length > 0 && data[0].defs) {
        statusDiv.classList.add('hidden');
        resultContainer.classList.remove('hidden');

        wordText.textContent = phrase;
        phoneticText.textContent = '[ idiom / phrase ]';
        audioBtn.style.display = 'none';

        meaningsContainer.innerHTML = '';

        const block = document.createElement('div');
        block.className = 'meaning-block';

        const pos = document.createElement('div');
        pos.className = 'part-of-speech';
        pos.textContent = 'idiom / phrase';
        block.appendChild(pos);

        const list = document.createElement('ol');
        list.className = 'definition-list';

        data[0].defs.forEach(defStr => {
          const parts = defStr.split('\t');
          const definitionText = parts[1] || parts[0];

          const item = document.createElement('li');
          item.className = 'definition-item';
          item.innerHTML = `
            <div>${definitionText}</div>
            <div class="example-sentence"><strong>Example:</strong> "We decided to <em>${phrase}</em> and get the job done."</div>
          `;
          list.appendChild(item);
        });

        block.appendChild(list);
        meaningsContainer.appendChild(block);
      } else {
        showStatus(`No definitions found for "${phrase}". Try searching another word or idiom.`, true);
      }
    }

    // Audio Player Event
    audioBtn.addEventListener('click', () => {
      if (currentAudioUrl) {
        const audio = new Audio(currentAudioUrl);
        audio.play().catch(e => alert("Audio playback error: " + e.message));
      }
    });

    function showStatus(msg, isError = false) {
      statusDiv.textContent = msg;
      statusDiv.className = isError ? 'status-msg error-msg' : 'status-msg';
      statusDiv.classList.remove('hidden');
    }
  </script>
</body>
</html>
