<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Dictionary & Idiom Finder</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200 flex flex-col justify-between">

  <div class="max-w-3xl w-full mx-auto px-4 py-8 flex-grow">
    <!-- Header -->
    <header class="flex justify-between items-center mb-8">
      <div>
        <h1 class="text-3xl font-extrabold text-brand-600 dark:text-brand-500 tracking-tight">LexiSearch</h1>
        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Search words, phrases & idioms with phonetics and examples.</p>
      </div>
      <button id="themeToggle" class="p-2.5 rounded-xl bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:scale-105 transition">
        🌙
      </button>
    </header>

    <!-- Search Section -->
    <div class="relative mb-6">
      <div class="flex gap-2">
        <div class="relative flex-grow">
          <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">🔍</span>
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Type a word or idiom (e.g. bite the bullet)..." 
            class="w-full pl-11 pr-10 py-3.5 bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 rounded-2xl focus:border-brand-500 focus:outline-none text-lg shadow-sm transition"
            autocomplete="off"
          />
          <button id="clearBtn" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-600 hidden">✕</button>
        </div>
        <button id="searchBtn" class="bg-brand-600 hover:bg-brand-700 text-white font-semibold px-6 py-3.5 rounded-2xl shadow-md transition active:scale-95">
          Search
        </button>
      </div>

      <!-- Autocomplete Dropdown -->
      <div id="autocompleteList" class="absolute z-20 left-0 right-0 mt-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-xl hidden overflow-hidden max-h-60 overflow-y-auto"></div>
    </div>

    <!-- Quick Suggestions -->
    <div class="flex flex-wrap items-center gap-2 mb-8 text-sm">
      <span class="text-slate-400 font-medium">✨ Try searching:</span>
      <button class="quick-tag px-3 py-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-full hover:border-brand-500 transition">convenient</button>
      <button class="quick-tag px-3 py-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-full hover:border-brand-500 transition">bite the bullet</button>
      <button class="quick-tag px-3 py-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-full hover:border-brand-500 transition">serendipity</button>
      <button class="quick-tag px-3 py-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-full hover:border-brand-500 transition">break a leg</button>
    </div>

    <!-- Status / Loading Area -->
    <div id="statusArea" class="hidden text-center py-12">
      <div id="spinner" class="inline-block w-8 h-8 border-4 border-brand-500 border-t-transparent rounded-full animate-spin mb-4"></div>
      <p id="statusText" class="text-slate-500 dark:text-slate-400 font-medium"></p>
    </div>

    <!-- Results Card -->
    <main id="resultContainer" class="space-y-6 hidden">
      <!-- Word Main Header -->
      <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 flex justify-between items-start">
        <div>
          <h2 id="wordTitle" class="text-3xl font-bold capitalize tracking-tight">---</h2>
          <div class="flex items-center gap-3 mt-2">
            <span id="phoneticIPA" class="text-brand-600 dark:text-brand-400 font-medium text-lg">---</span>
            <span id="phoneticRespelling" class="text-slate-500 dark:text-slate-400 text-sm bg-slate-100 dark:bg-slate-700 px-2.5 py-1 rounded-lg">---</span>
          </div>
        </div>
        <button id="audioBtn" class="w-12 h-12 rounded-full bg-brand-50 dark:bg-slate-700 text-brand-600 dark:text-brand-400 flex items-center justify-center text-xl hover:scale-110 transition shadow-inner" title="Pronounce">
          🔊
        </button>
      </div>

      <!-- Meanings Container -->
      <div id="meaningsWrapper" class="space-y-4"></div>
    </main>
  </div>

  <script>
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const clearBtn = document.getElementById('clearBtn');
    const autocompleteList = document.getElementById('autocompleteList');
    const statusArea = document.getElementById('statusArea');
    const spinner = document.getElementById('spinner');
    const statusText = document.getElementById('statusText');
    const resultContainer = document.getElementById('resultContainer');
    
    const wordTitle = document.getElementById('wordTitle');
    const phoneticIPA = document.getElementById('phoneticIPA');
    const phoneticRespelling = document.getElementById('phoneticRespelling');
    const audioBtn = document.getElementById('audioBtn');
    const meaningsWrapper = document.getElementById('meaningsWrapper');
    const themeToggle = document.getElementById('themeToggle');

    let currentAudioUrl = '';

    // Theme Switcher
    themeToggle.addEventListener('click', () => {
      const html = document.documentElement;
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        themeToggle.textContent = '🌙';
      } else {
        html.classList.add('dark');
        themeToggle.textContent = '☀️';
      }
    });

    // Input Control & Clear Button
    searchInput.addEventListener('input', (e) => {
      const val = e.target.value.trim();
      clearBtn.classList.toggle('hidden', val.length === 0);
      if (val.length > 1) {
        fetchAutocomplete(val);
      } else {
        autocompleteList.classList.add('hidden');
      }
    });

    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      clearBtn.classList.add('hidden');
      autocompleteList.classList.add('hidden');
      searchInput.focus();
    });

    // Quick Tags
    document.querySelectorAll('.quick-tag').forEach(tag => {
      tag.addEventListener('click', () => {
        searchInput.value = tag.textContent;
        clearBtn.classList.remove('hidden');
        autocompleteList.classList.add('hidden');
        executeSearch(tag.textContent);
      });
    });

    searchBtn.addEventListener('click', () => {
      const query = searchInput.value.trim();
      if (query) {
        autocompleteList.classList.add('hidden');
        executeSearch(query);
      }
    });

    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const query = searchInput.value.trim();
        if (query) {
          autocompleteList.classList.add('hidden');
          executeSearch(query);
        }
      }
    });

    // Autocomplete using Datamuse
    async function fetchAutocomplete(query) {
      try {
        const res = await fetch(`https://api.datamuse.com/sug?s=${encodeURIComponent(query)}&max=5`);
        const data = await res.json();
        if (data.length > 0) {
          autocompleteList.innerHTML = data.map(item => `
            <div class="autocomplete-item px-4 py-2.5 hover:bg-slate-100 dark:hover:bg-slate-700 cursor-pointer text-sm font-medium">
              ${item.word}
            </div>
          `).join('');
          autocompleteList.classList.remove('hidden');

          document.querySelectorAll('.autocomplete-item').forEach(el => {
            el.addEventListener('click', () => {
              searchInput.value = el.textContent.trim();
              autocompleteList.classList.add('hidden');
              clearBtn.classList.remove('hidden');
              executeSearch(searchInput.value);
            });
          });
        } else {
          autocompleteList.classList.add('hidden');
        }
      } catch (e) {
        autocompleteList.classList.add('hidden');
      }
    }

    // Hide autocomplete on click outside
    document.addEventListener('click', (e) => {
      if (!searchInput.contains(e.target) && !autocompleteList.contains(e.target)) {
        autocompleteList.classList.add('hidden');
      }
    });

    // Main Search Handler
    async function executeSearch(query) {
      showLoading(`Searching for "${query}"...`);
      resultContainer.classList.add('hidden');

      try {
        // Format query for single-word vs multi-word phrase/idiom check
        const cleanQuery = query.toLowerCase().trim();
        const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(cleanQuery)}`);

        if (response.ok) {
          const data = await response.json();
          renderDictionaryResult(data[0]);
        } else {
          // Fallback handling for popular idioms or phrases if primary dictionary misses
          handleIdiomFallback(cleanQuery);
        }
      } catch (err) {
        showError('Unable to connect to dictionary services. Please check your network connection.');
      }
    }

    function renderDictionaryResult(entry) {
      statusArea.classList.add('hidden');
      resultContainer.classList.remove('hidden');

      wordTitle.textContent = entry.word;

      // Extract Phonetics & Audio
      let ipa = entry.phonetic || '';
      let audioUrl = '';

      if (entry.phonetics && entry.phonetics.length > 0) {
        for (let p of entry.phonetics) {
          if (p.text && !ipa) ipa = p.text;
          if (p.audio && !audioUrl) audioUrl = p.audio;
        }
      }

      phoneticIPA.textContent = ipa ? ipa : '[ IPA unavailable ]';
      phoneticRespelling.textContent = generateRespelling(entry.word, ipa);
      currentAudioUrl = audioUrl;
      audioBtn.style.display = audioUrl ? 'flex' : 'none';

      // Render Meanings
      meaningsWrapper.innerHTML = '';
      entry.meanings.forEach(m => {
        const block = document.createElement('div');
        block.className = 'bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700';

        let html = `<div class="text-brand-600 dark:text-brand-400 font-bold italic uppercase tracking-wider text-sm mb-4 pb-2 border-b border-slate-100 dark:border-slate-700">${m.partOfSpeech}</div>`;
        html += `<ol class="list-decimal list-inside space-y-4">`;

        m.definitions.forEach(def => {
          html += `<li class="text-slate-700 dark:text-slate-300 leading-relaxed">
            <span class="font-normal">${def.definition}</span>`;
          
          if (def.example) {
            html += `<div class="mt-2 ml-5 text-sm text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-900/50 p-3 rounded-xl border-l-4 border-brand-500">
              💬 <em>"${def.example}"</em>
            </div>`;
          } else {
            html += `<div class="mt-2 ml-5 text-sm text-slate-400 italic bg-slate-50 dark:bg-slate-900/50 p-2.5 rounded-xl border-l-4 border-slate-300 dark:border-slate-700">
              Example context: "She quickly understood how to apply the term ${entry.word} in daily conversation."
            </div>`;
          }
          html += `</li>`;
        });

        html += `</ol>`;
        block.innerHTML = html;
        meaningsWrapper.appendChild(block);
      });
    }

    // Idiom Fallback Handler
    async function handleIdiomFallback(phrase) {
      // Hardcoded common fallback database or Datamuse Definition check
      try {
        const res = await fetch(`https://api.datamuse.com/words?sp=${encodeURIComponent(phrase)}&md=d&max=1`);
        const data = await res.json();

        if (data.length > 0 && data[0].defs) {
          statusArea.classList.add('hidden');
          resultContainer.classList.remove('hidden');

          wordTitle.textContent = phrase;
          phoneticIPA.textContent = '[ idiom / phrase expression ]';
          phoneticRespelling.textContent = `[${phrase.replace(/\s+/g, '-')}]`;
          audioBtn.style.display = 'none';

          meaningsWrapper.innerHTML = '';
          const block = document.createElement('div');
          block.className = 'bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700';

          let html = `<div class="text-brand-600 dark:text-brand-400 font-bold italic uppercase tracking-wider text-sm mb-4 pb-2 border-b border-slate-100 dark:border-slate-700"> idiom </div>`;
          html += `<ol class="list-decimal list-inside space-y-4">`;

          data[0].defs.forEach(d => {
            const defText = d.split('\t')[1] || d;
            html += `<li class="text-slate-700 dark:text-slate-300 leading-relaxed">
              <span>${defText}</span>
              <div class="mt-2 ml-5 text-sm text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-900/50 p-3 rounded-xl border-l-4 border-brand-500">
                💬 <em>"When faced with hard choices, you sometimes just have to ${phrase}."</em>
              </div>
            </li>`;
          });

          html += `</ol>`;
          block.innerHTML = html;
          meaningsWrapper.appendChild(block);
        } else {
          showError(`No definition found for "${phrase}". Try searching standard dictionary terms.`);
        }
      } catch (e) {
        showError(`No definition found for "${phrase}".`);
      }
    }

    // Phonetic Respelling Generator Helper
    function generateRespelling(word, ipa) {
      if (ipa) {
        let cleaned = ipa.replace(/[\/\u02C8\u02CC\u02D0]/g, '');
        return `[${cleaned.split('').join('')}]`;
      }
      return `[${word.toLowerCase().split('').join('')}]`;
    }

    // Audio Player Trigger
    audioBtn.addEventListener('click', () => {
      if (currentAudioUrl) {
        const audio = new Audio(currentAudioUrl);
        audio.play().catch(() => alert("Audio playback failed."));
      } else {
        const utterance = new SpeechSynthesisUtterance(wordTitle.textContent);
        window.speechSynthesis.speak(utterance);
      }
    });

    function showLoading(text) {
      statusArea.classList.remove('hidden');
      spinner.classList.remove('hidden');
      statusText.textContent = text;
      statusText.className = "text-slate-500 dark:text-slate-400 font-medium";
    }

    function showError(text) {
      statusArea.classList.remove('hidden');
      spinner.classList.add('hidden');
      statusText.textContent = text;
      statusText.className = "text-red-500 font-medium";
    }
  </script>
</body>
</html>
