<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Study Dictionary</title>
<style>
  :root{
    --primary:#4a90e2;--primary-dark:#357abd;--primary-light:#eef5fc;
    --bg:#f0f2f5;--card:#fff;--text:#1a1a2e;--muted:#6b7280;--border:#e5e7eb;
    --danger:#ef4444;--radius:14px;--shadow:0 8px 30px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .header{background:linear-gradient(135deg,var(--primary),#6c63ff);padding:38px 20px 54px;
    text-align:center;color:#fff}
  .header h1{font-size:26px;font-weight:700}
  .header p{font-size:14px;opacity:.85;margin-top:4px}
  .container{max-width:720px;margin:-28px auto 40px;padding:0 16px}
  .search-wrapper{display:flex;gap:8px;background:var(--card);padding:6px;border-radius:var(--radius);
    box-shadow:var(--shadow);border:2px solid transparent;transition:border-color .2s}
  .search-wrapper:focus-within{border-color:var(--primary)}
  .search-wrapper input{flex:1;border:none;outline:none;padding:12px 16px;font-size:16px;background:transparent;color:var(--text)}
  .search-btn{padding:12px 24px;background:var(--primary);color:#fff;border:none;border-radius:9px;
    font-size:15px;font-weight:600;cursor:pointer;transition:background .2s,transform .1s;white-space:nowrap}
  .search-btn:hover{background:var(--primary-dark)}.search-btn:active{transform:scale(.97)}
  .search-btn:disabled{opacity:.6;cursor:not-allowed}
  .quick-tags{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 22px}
  .quick-tag{padding:6px 14px;background:var(--card);border:1px solid var(--border);border-radius:999px;
    font-size:13px;color:var(--muted);cursor:pointer;transition:.15s}
  .quick-tag:hover{background:var(--primary-light);color:var(--primary);border-color:var(--primary)}
  .status{text-align:center;margin:14px 0;font-size:15px;font-weight:500;min-height:22px}
  .status.err{color:var(--danger)}.status.load{color:var(--primary)}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px;
    border:1px solid var(--border);display:none;animation:pop .25s ease}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .word-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    border-bottom:2px solid var(--border);padding-bottom:14px;margin-bottom:18px}
  .word-title{font-size:30px;font-weight:700;color:var(--primary)}
  .badges{display:flex;gap:8px;flex-wrap:wrap}
  .badge{background:var(--primary-light);color:var(--primary);padding:4px 11px;border-radius:7px;
    font-size:13px;font-weight:600}
  .badge.pos{background:#fef3c7;color:#b45309}
  .audio-btn{background:var(--primary);color:#fff;border:none;width:38px;height:38px;border-radius:50%;
    cursor:pointer;font-size:16px;flex-shrink:0}
  .section{margin-bottom:18px}
  .label{font-weight:700;font-size:15px;color:#111;display:block;margin-bottom:6px}
  .def{font-size:16px}
  .meanings{list-style:none}
  .meanings li{margin-bottom:12px;padding-left:14px;border-left:3px solid var(--primary-light)}
  .m-pos{font-style:italic;color:var(--muted);font-size:14px;margin-right:6px}
  ul.examples{list-style:disc;padding-left:22px}
  ul.examples li{margin-bottom:8px;color:var(--muted);font-size:15px}
  .src{font-size:12px;color:var(--muted);margin-top:16px;text-align:right}
  .suggest{margin-top:10px;font-size:14px;color:var(--muted)}
  .suggest b{color:var(--primary);cursor:pointer}
  mark{background:#fff3bf;color:inherit;padding:0 2px;border-radius:3px}
</style>
</head>
<body>
<div class="header"><h1>📖 Study Dictionary</h1><p>Words, idioms & proverbs — online search with curated offline set</p></div>
<div class="container">
  <div class="search-wrapper">
    <input id="q" type="text" placeholder="Type any word, phrase or idiom..." autocomplete="off"/>
    <button id="go" class="search-btn">Search</button>
  </div>
  <div class="quick-tags" id="tags"></div>
  <div class="status" id="status"></div>
  <div class="card" id="card"></div>
</div>

<script>
